[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-windows-knowledge-graph"
version = "0.1.0"
description = "Neo4j-first Company Knowledge Graph with hybrid search and graph intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "neo4j>=5.20,<7",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "charset-normalizer>=3.3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["flet>=0.82.2"]
mcp = ["mcp>=1.9,<2"]
docling = ["docling>=2.0"]
test = ["pytest>=8.0"]

[project.scripts]
win-kg = "winkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
