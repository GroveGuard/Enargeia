[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enargeia"
version = "1.2.2"
description = "Enargeia: a self-learning corporate knowledge graph with hybrid search and graph intelligence"
requires-python = ">=3.10"
dependencies = [
  "neo4j>=5.20,<7",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "charset-normalizer>=3.3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["flet[desktop]==1.0.5", "pywebview>=5.4"]
local-embeddings = ["fastembed==0.9.0", "onnxruntime==1.23.0", "huggingface-hub==0.36.2"]
mcp = ["mcp>=1.9,<2", "tomlkit>=0.13"]
docling = ["docling>=2.0"]
test = ["pytest>=8.0"]
package = ["pyinstaller>=6.0", "keyring>=25; platform_system == 'Windows'"]
dev = [
  "flet[desktop]==1.0.5",
  "pywebview>=5.4",
  "fastembed==0.9.0",
  "onnxruntime==1.23.0",
  "huggingface-hub==0.36.2",
  "docling>=2.0",
  "mcp>=1.9,<2",
  "tomlkit>=0.13",
  "pytest>=8.0",
  "keyring>=25; platform_system == 'Windows'",
]

[project.scripts]
enargeia-cli = "winkg.cli:main"
enargeia-mcp = "winkg.mcp_server:main"
enargeia = "winkg.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
winkg = ["ui/*.html", "ui/assets/*.png", "ui/assets/*.ico"]
